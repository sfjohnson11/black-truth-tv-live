<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Black Truth TV Network</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 280px;
      background: linear-gradient(to bottom, #111, #000);
      overflow-y: auto;
      border-right: 2px solid #222;
      padding: 20px;
    }
    .channel {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 6px;
      background: #1a1a1a;
      cursor: pointer;
      transition: background 0.3s;
    }
    .channel:hover {
      background: #292929;
    }
    .channel h4 {
      margin: 0;
      color: gold;
      font-size: 1em;
    }
    .channel p {
      font-size: 0.8em;
      color: #aaa;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #111;
    }
    .header {
      background: #000;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid #222;
    }
    .header img {
      height: 60px;
      margin-right: 15px;
    }
    .header h1 {
      color: gold;
      font-size: 1.5em;
      margin: 0;
    }
    .player-container {
      flex-grow: 1;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
    }
    .now-playing {
      background: #222;
      padding: 10px;
      text-align: center;
      color: #0f0;
      font-weight: bold;
    }
    .ticker {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 0.9em;
      white-space: nowrap;
      overflow: hidden;
    }
    .ticker span {
      display: inline-block;
      animation: scroll 20s linear infinite;
    }
    @keyframes scroll {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="sidebar" id="channelSidebar">
    <h3 style="color:gold;">Channel Guide</h3>
  </div>
  <div class="main">
    <div class="header">
      <img src="blacktruth1.jpeg" alt="Black Truth TV Logo">
      <h1>Black Truth TV</h1>
    </div>
    <div class="now-playing" id="nowPlaying">Now Playing: --</div>
    <div class="player-container">
      <video id="player" controls autoplay poster="blacktruth1.jpeg"></video>
      <div class="ticker"><span id="tickerText">Welcome to Black Truth TV Network — Your History, Your Voice, Your Future.</span></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient(
      import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_ANON_KEY
    );

    const sidebar = document.getElementById("channelSidebar");
    const nowPlaying = document.getElementById("nowPlaying");
    const player = document.getElementById("player");
    const tickerText = document.getElementById("tickerText");

    async function loadChannels() {
      const { data: channels } = await supabase.from('channels').select('*').order('id');
      channels.forEach(ch => {
        const div = document.createElement("div");
        div.className = "channel";
        div.innerHTML = \`<h4>\${ch.name}</h4><p>\${ch.description || ""}</p>\`;
        div.onclick = () => loadChannel(ch.id);
        sidebar.appendChild(div);
      });
    }

    async function loadChannel(channelId) {
      const bucket = "channel" + channelId;
      const { data: programs } = await supabase
        .from('programs')
        .select('*')
        .eq('channel_id', channelId)
        .order('start_time');

      const now = new Date();
      const current = programs.find(p => new Date(p.start_time) <= now);
      const next = programs.find(p => new Date(p.start_time) > now);

      nowPlaying.textContent = current ? "Now Playing: " + current.title : "Now Playing: --";

      if (current?.mp4_url) {
        player.src = \`\${import.meta.env.VITE_SUPABASE_URL}/storage/v1/object/public/\${bucket}/\${current.mp4_url}\`;
      } else {
        player.src = \`\${import.meta.env.VITE_SUPABASE_URL}/storage/v1/object/public/\${bucket}/standby.mp4\`;
      }

      if (next?.title) {
        tickerText.textContent = "Coming Up Next: " + next.title;
      }

      const { data: manual } = await supabase
        .from('ticker')
        .select('*')
        .eq('is_active', true)
        .order('updated_at', { ascending: false })
        .limit(1);
      if (manual?.length) {
        tickerText.textContent += "  |  " + manual[0].message;
      }
    }

    loadChannels();
  </script>
</body>
</html>
